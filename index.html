<style>

header{padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0}header .url{color:var(--mut);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--sel);color:#fff}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:99px;cursor:pointer;font:inherit;font-size:12px}
.chip.off{opacity:.45;text-decoration:line-through}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.side,.detail{max-height:calc(100vh - 100px);overflow:auto}
.side h2,.detail h2{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.rule{display:flex;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}

.pass{padding:8px 12px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line)}.pass b{color:var(--ok)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--mut);padding:7px 12px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-color:var(--sel);font-weight:600}.tab i{font-style:normal;background:var(--err);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.panes{display:grid;gap:0}.panes.two{grid-template-columns:1fr 1fr}
.pane{overflow:auto;height:calc(100vh - 190px);min-height:420px;overscroll-behavior:contain;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:8px 0}
.panes.two .pane+.pane{border-left:1px solid var(--line)}
.ph{font:600 11px system-ui;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:6px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.row{padding:0 12px;white-space:pre-wrap;word-break:break-word;border-left:3px solid transparent;cursor:default}
.row.tg{cursor:pointer}.row.tg:hover{background:var(--bg)}
.arrow{display:inline-block;width:14px;color:var(--mut)}
.k{color:var(--key)}.s{color:var(--str)}.nm{color:var(--num)}.mut{color:var(--mut)}
.row.err{background:var(--errbg);border-left-color:var(--err)}
.row.fix{background:var(--okbg);border-left-color:var(--ok)}
.row.gone{background:var(--bg);color:var(--mut);font-style:italic;border-left-color:var(--mut)}
.row.sel{outline:2px solid var(--sel);outline-offset:-2px}
.row.hasdesc .dot{display:inline-block;background:var(--err);color:#fff;border-radius:99px;padding:0 6px;font:600 10px system-ui;margin-left:6px}
.tag{font:600 10px system-ui;padding:1px 6px;border-radius:5px;margin-left:8px;cursor:pointer;white-space:nowrap}
.tag.IT{background:var(--err);color:#fff}.tag.DC{background:var(--warn);color:#fff}.tag.KB{background:var(--kb);color:#fff}
.pipe{background:var(--err);color:#fff;border-radius:3px;padding:0 3px;font-weight:700}
.detail{padding-bottom:10px}.detail .body{padding:10px 12px}.detail h3{margin:0 0 4px;font-size:15px}
.lbl{font:600 11px system-ui;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px}
pre.v{margin:0;padding:8px;border-radius:6px;background:var(--bg);white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;max-height:140px;overflow:auto}
pre.v.bad{background:var(--errbg);color:var(--err)}pre.v.good{background:var(--okbg);color:var(--ok)}
.nav{display:flex;gap:6px;align-items:center;margin-top:10px}.empty{padding:18px 12px;color:var(--mut)}
.locs{display:flex;flex-direction:column;gap:3px;max-height:120px;overflow:auto;font:11px ui-monospace,Menlo,monospace}
.locs a{color:var(--sel);cursor:pointer;text-decoration:underline}
</style>

 A1:{cat:'IT',t:'reviewCount đang bằng ratingCount',why:'Mô tả gốc tách riêng số lượt chấm sao (ratingCount) và số "N đánh giá" hiển thị trên trang (reviewCount). Web chép số lượt chấm sao sang cả hai nên hai số luôn bằng nhau.'},
 A3:{cat:'IT',t:'Thông số nối bằng "|"',why:'Ký tự "|" là dấu phân cách nội bộ, không nên lộ ra schema. Mô tả gốc lấy text thuần, các mục nối bằng dấu phẩy.'},
 A5:{cat:'IT',t:'Các màu cùng một tên',why:'Mỗi biến thể phải có tên riêng: tên sản phẩm + màu + "chính hãng, giá tốt" (đúng như caption ảnh của chính biến thể).'},
 A6:{cat:'IT',t:'Biến thể lặp thông số cả dòng máy',why:'Biến thể chỉ khác nhau ở màu (color). Danh sách dung lượng và màu của cả dòng đã có ở khối cha, lặp lại ở từng biến thể là thừa.'},
 A7:{cat:'IT',t:'aggregateRating đặt cả ở biến thể',why:'Mô tả gốc chỉ cho ProductGroup có rating. Đặt thêm ở biến thể làm Google Search Console báo trùng khai báo đánh giá.'},
 A8:{cat:'IT',t:'copyrightNotice ghi địa chỉ web',why:'Mô tả gốc ghi © + tên công ty, giống creditText. Web đang ghi © + địa chỉ web.'},
 B2:{cat:'DC',t:'Biến thể của trang khác khai đầy đủ ở đây',why:'Mỗi dung lượng là một URL riêng. Trang chỉ khai đầy đủ biến thể màu của chính nó; biến thể thuộc trang khác chỉ ghi url. Hiện cả 3 trang 256GB / 512GB / 1TB cùng khai đủ 9 biến thể nên bị trùng.'},
 B3:{cat:'DC',t:'returnMethod = ReturnAtKiosk',why:'Mô tả gốc ghi ReturnAtKiosk và web ra đúng vậy, nhưng chính sách thật là đổi trả tại cửa hàng. Đã chốt đổi sang ReturnInStore.'},
 B5:{cat:'KB',t:'Tên hãng "iPhone (Apple)"',why:'Tên hãng trong dữ liệu khai báo là "iPhone (Apple)" ở 22 trang, 11 trang khác dùng "Apple". Đổi tên hãng iPhone về "Apple" ở khai báo.'},
 D3:{cat:'KB',t:'Mô tả sản phẩm sai chính tả, thiếu màu',why:'Mô tả ghi "sliver" (sai chính tả) và chỉ nêu 2 trong 3 màu. Sửa trong khai báo sản phẩm, không phải việc IT.'}
};
const PH_REVIEW='<số "N đánh giá" hiện trên trang>',PH_DESC='<mô tả sản phẩm khai báo lại: đủ tên màu (Cam Vũ Trụ, Bạc, Xanh Đậm), không lỗi chính tả>';
const urlPath=u=>{try{return new URL(u).pathname}catch(e){return String(u)}};
const toks=p=>p.split(/\.|\[(\d+)\]/).filter(x=>x!==undefined&&x!=='').map(x=>/^\d+$/.test(x)?+x:x);
const clone=o=>JSON.parse(JSON.stringify(o));

function detect(pg){
 const hits=[],add=(id,path,cur,fix,ev)=>hits.push({id,path,cur,fix,ev});
 const op=urlPath(pg.url),vs=pg.hasVariant||[],own=[],foreign=[];
 vs.forEach((v,i)=>(urlPath(v.url)===op?own:foreign).push(i));
 const ag=pg.aggregateRating;
 if(ag&&ag.reviewCount===ag.ratingCount) add('A1','aggregateRating.reviewCount',ag.reviewCount,{op:'set',value:PH_REVIEW},`ratingCount = ${ag.ratingCount} và reviewCount = ${ag.reviewCount}: hai số bằng nhau.`);
 (pg.additionalProperty||[]).forEach((a,j)=>{if(String(a.value).includes('|'))add('A3',`additionalProperty[${j}].value`,a.value,{op:'set',value:String(a.value).split('|').join(', ')},`Giá trị chứa ${String(a.value).split('|').length-1} dấu "|" (thông số "${a.name}").`)});
 const names={};own.forEach(i=>{(names[vs[i].name]=names[vs[i].name]||[]).push(i)});
 own.forEach(i=>{const v=vs[i],p=`hasVariant[${i}]`;
  if(names[v.name].length>1)add('A5',p+'.name',v.name,{op:'set',value:v.image&&v.image[0]?v.image[0].caption:v.name},`${names[v.name].length} biến thể của trang này cùng tên "${v.name}" (màu: ${names[v.name].map(k=>vs[k].color).join(', ')}).`);
  if(v.additionalProperty)add('A6',p+'.additionalProperty',`[${v.additionalProperty.length} mục: ${[...new Set(v.additionalProperty.map(a=>a.name))].join(', ')}]`,{op:'remove',label:'bỏ additionalProperty (đã có color)'},`Biến thể "${v.color}" có ${v.additionalProperty.length} mục additionalProperty, liệt kê cả 3 dung lượng và 3 màu của dòng máy.`);
  if(v.aggregateRating)add('A7',p+'.aggregateRating',`ratingValue ${v.aggregateRating.ratingValue}, ratingCount ${v.aggregateRating.ratingCount}`,{op:'remove',label:'bỏ aggregateRating (chỉ để ở ProductGroup)'},`ProductGroup đã có aggregateRating (ratingCount ${ag&&ag.ratingCount}); biến thể "${v.color}" có thêm rating riêng.`);
  (v.image||[]).forEach((im,k)=>{if(/^©\s*https?:/.test(im.copyrightNotice||''))add('A8',`${p}.image[${k}].copyrightNotice`,im.copyrightNotice,{op:'set',value:'© '+im.creditText},`copyrightNotice = "${im.copyrightNotice}" trong khi creditText = "${im.creditText}".`)});
  const rm=v.offers&&v.offers.hasMerchantReturnPolicy&&v.offers.hasMerchantReturnPolicy.returnMethod;
  if(rm&&/ReturnAtKiosk/.test(rm))add('B3',p+'.offers.hasMerchantReturnPolicy.returnMethod',rm,{op:'set',value:'https://schema.org/ReturnInStore'},`returnMethod = ${rm}`);
  if(/sliver/i.test(v.description||''))add('D3',p+'.description',v.description,{op:'set',value:PH_DESC},'Mô tả chứa "sliver"; tên màu thật của sản phẩm: Cam Vũ Trụ, Bạc, Xanh Đậm.');
 });
 foreign.forEach(i=>{const v=vs[i];add('B2',`hasVariant[${i}]`,`Product đầy đủ (${v.size} ${v.color}): ${Object.keys(v).length} khóa, có offers giá ${v.offers&&v.offers.price}`,{op:'replace',value:{'@type':'Product',url:v.url}},`Biến thể ${v.size} ${v.color} có URL ${urlPath(v.url)}, khác URL trang đang xem ${op}, nhưng vẫn khai đầy đủ (image, offers, thông số...).`)});
 if(pg.brand&&/\(/.test(pg.brand.name))add('B5','brand.name',pg.brand.name,{op:'set',value:'Apple'},`brand.name = "${pg.brand.name}" (có dấu ngoặc, hai tên hãng cùng tồn tại trong dữ liệu).`);
 if(/sliver/i.test(pg.description||''))add('D3','description',pg.description,{op:'set',value:PH_DESC},'Mô tả chứa "sliver"; tên màu thật của sản phẩm: Cam Vũ Trụ, Bạc, Xanh Đậm.');
 return hits;
}
function checks(pg){
 const vs=pg.hasVariant||[],all=JSON.stringify(pg),r=[];
 r.push(['Giá > 0 ở mọi biến thể',vs.every(v=>v.offers&&v.offers.price>0),`${vs.length} biến thể`]);
 r.push(['Mọi biến thể có tình trạng còn hàng (availability)',vs.every(v=>v.offers&&v.offers.availability),'']);
 r.push(['Mọi ảnh đều có url',vs.every(v=>(v.image||[]).every(i=>i.url)),'']);
 r.push(['sku không trùng giữa các biến thể',new Set(vs.map(v=>v.sku)).size===vs.length,'']);
 r.push(['@id biến thể không trùng',new Set(vs.map(v=>v['@id'])).size===vs.length,'']);
 r.push(['Không có chuỗi "undefined" / "null" / "NaN"',!/"(undefined|null|NaN)"/.test(all),'']);
 r.push(['Không có mảng rỗng []',!/\[\]/.test(all),'']);
 r.push(['ratingCount > 0',pg.aggregateRating&&pg.aggregateRating.ratingCount>0,'']);
 r.push(['Thời gian giao hàng có min/max (handlingTime, transitTime)',vs.every(v=>{const d=v.offers&&v.offers.shippingDetails&&v.offers.shippingDetails.deliveryTime;return d&&d.handlingTime&&d.handlingTime.minValue!=null&&d.transitTime&&d.transitTime.maxValue!=null}),'']);
 return r;
}
function setPath(o,p,val){const t=toks(p);let c=o;for(let i=0;i<t.length-1;i++)c=c[t[i]];c[t[t.length-1]]=val}
function buildAfter(pg,hits){const a=clone(pg),ch=new Set();
 hits.forEach(h=>{const f=h.fix;let v=f.op==='remove'?{__removed:f.label}:f.value;setPath(a,h.path,clone(v));ch.add(h.path)});return {a,ch}}

const S={mode:'before',tab:'ProductGroup',cats:new Set(['IT','DC','KB']),open:new Set(),full:new Set(),onlyErr:false,sel:null,selRule:null};
const PG=DATA.ProductGroup,ALL=detect(PG);
const active=()=>ALL.filter(h=>S.cats.has(META[h.id].cat));
const ancestors=p=>{const out=[''],t=toks(p);let cur='';t.forEach((k,i)=>{cur+=typeof k==='number'?`[${k}]`:(cur?'.':'')+k;if(i<t.length-1)out.push(cur)});return out};
function defaultOpen(){S.open=new Set(['']);ALL.forEach(h=>ancestors(h.path).forEach(a=>S.open.add(a)))}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const join=(p,k)=>typeof k==='number'?`${p}[${k}]`:(p?`${p}.${k}`:k);

function fmtPrim(v,path,ctx){
 if(typeof v==='number'||typeof v==='boolean'||v===null)return `<span class="nm">${v}</span>`;
 let s=String(v),long=s.length>150&&!S.full.has(ctx.id+path);
 let shown=long?s.slice(0,150):s;let h=esc(shown);
 if(ctx.mode==='before'&&ctx.hp[path]&&ctx.hp[path].some(x=>x.id==='A3'))h=h.split('|').join('<span class="pipe">|</span>');
 return `<span class="s">"${h}${long?'…':''}"</span>${long?' <span class="mut">[bấm để xem hết]</span>':''}`;
}
function renderTree(root,ctx){
 const rows=[];
 const walk=(key,v,path,depth,last)=>{
  const hs=ctx.hp[path]||[],d=ctx.desc[path]||0;
  const kh=key===null?'':`<span class="k">"${esc(key)}"</span>: `;
  const comma=last?'':',';
  const pad=`style="padding-left:${12+depth*16}px"`;
  const tags=ctx.mode==='after'?'':hs.map(h=>`<span class="tag ${META[h.id].cat}" data-i="${ALL.indexOf(h)}">${h.id}</span>`).join('');
  const cls=[ctx.mode==='before'&&hs.length?'err':'',ctx.mode==='after'&&ctx.ch.has(path)?'fix':'',S.sel&&S.sel.path===path&&ctx.mode!=='after'?'sel':(ctx.mode==='after'&&S.sel&&S.sel.path===path?'sel':'')].filter(Boolean).join(' ');
  if(v&&typeof v==='object'&&v.__removed!==undefined){rows.push(`<div class="row gone" data-path="${path}" ${pad}>${kh}— ${esc(v.__removed)} —</div>`);return}
  if(v&&typeof v==='object'){
   const arr=Array.isArray(v),keys=arr?v.map((_,i)=>i):Object.keys(v),op=arr?'[':'{',cl=arr?']':'}';
   if(!keys.length){rows.push(`<div class="row ${cls}" data-path="${path}" ${pad}>${kh}${op}${cl}${comma}${tags}</div>`);return}
   const open=S.open.has(path)||(ctx.mode!=='after'&&false);
   const show=!S.onlyErr||path===''||d>0||hs.length>0||ctx.ch.has(path);
   if(!show)return;
   const dot=(!open&&d>0&&ctx.mode!=='after')?`<span class="dot">${d} lỗi</span>`:'';
   const fixdot=(!open&&ctx.mode==='after'&&ctx.chd[path])?`<span class="dot" style="background:var(--ok)">${ctx.chd[path]} sửa</span>`:'';
   rows.push(`<div class="row tg ${cls} ${dot?'hasdesc':''}" data-path="${path}" data-t="1" ${pad}><span class="arrow">${open?'▾':'▸'}</span>${kh}${op}${open?'':` <span class="mut">${keys.length} ${arr?'phần tử':'khóa'} ${cl}${comma}</span>`}${dot}${fixdot}${tags}</div>`);
   if(open){keys.forEach((k,i)=>walk(arr?null:k,v[k],join(path,k),depth+1,i===keys.length-1));rows.push(`<div class="row" ${pad}>${cl}${comma}</div>`)}
   return}
  if(S.onlyErr&&!hs.length&&!ctx.ch.has(path))return;
  const isStr=typeof v==='string'&&v.length>150;
  rows.push(`<div class="row ${cls}" data-path="${path}" ${isStr?'data-f="1"':''} ${pad}>${kh}${fmtPrim(v,path,ctx)}${comma}${tags}</div>`);
 };
 walk(null,root,'',0,true);return rows.join('');
}
function ctxFor(mode,doc,hits,ch,id){
 const hp={},desc={},chd={};
 hits.forEach(h=>{(hp[h.path]=hp[h.path]||[]).push(h);ancestors(h.path).forEach(a=>desc[a]=(desc[a]||0)+1);ancestors(h.path).forEach(a=>chd[a]=(chd[a]||0)+1)});
 return {mode,hp,desc,chd,ch,id}
}
function render(){
 const keep={};document.querySelectorAll('.pane').forEach(p=>keep[p.dataset.mode]=p.scrollTop);const tabKey=S.tab;const sideTop=document.querySelector('.side')?document.querySelector('.side').scrollTop:0;const detTop=document.querySelector('.detail')?document.querySelector('.detail').scrollTop:0;
 const hits=active();
 document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));
 document.getElementById('chips').innerHTML=Object.keys(CAT).map(c=>`<button class="chip ${c} ${S.cats.has(c)?'':'off'}" data-c="${c}">${CAT[c]} (${ALL.filter(h=>META[h.id].cat===c).length})</button>`).join(' ');
 const pos=hits.length,types=new Set(hits.map(h=>h.id)).size;
 document.getElementById('stat').innerHTML=`<b>${types}</b> loại lỗi · <b>${pos}</b> vị trí`;
 // sidebar
 const groups={};ALL.forEach(h=>(groups[h.id]=groups[h.id]||[]).push(h));
 document.getElementById('rules').innerHTML=Object.keys(groups).filter(id=>S.cats.has(META[id].cat)).map(id=>`<div class="rule ${S.selRule===id?'sel':''}" data-id="${id}"><span class="code ${META[id].cat}">${id}</span><span class="t">${META[id].t}</span><span class="n">${groups[id].length} chỗ</span></div>`).join('')||'<div class="empty">Không có lỗi nào trong nhóm đang bật.</div>';
 const ck=checks(PG);
 document.getElementById('passes').innerHTML=ck.map(c=>`<div class="pass">${c[1]?'<b>✓</b>':'<b style="color:var(--err)">✗</b>'} ${c[0]}</div>`).join('');
 // tabs
 document.getElementById('tabs').innerHTML=Object.keys(DATA).map(t=>{const n=t==='ProductGroup'?hits.length:0;return `<button class="tab ${S.tab===t?'on':''}" data-t="${t}">${t}${n?`<i>${n}</i>`:''}</button>`}).join('');
 // panes
 const isPG=S.tab==='ProductGroup',src=DATA[S.tab];
 const hh=isPG?hits:[];const aft=isPG?buildAfter(PG,hh):{a:src,ch:new Set()};
 const P=document.getElementById('panes');P.className='panes'+(S.mode==='both'?' two':'');
 const mk=(label,mode)=>{const c=ctxFor(mode,mode==='after'?aft.a:src,hh,mode==='after'?aft.ch:new Set(),mode);return `<div class="pane" data-mode="${mode}"><div class="ph">${label}</div>${renderTree(mode==='after'?aft.a:src,c)}</div>`};
 P.innerHTML=S.mode==='before'?mk('Hiện tại (đang chạy trên Live)','before'):S.mode==='after'?mk('Sau khi fix','after'):mk('Hiện tại (đang chạy trên Live)','before')+mk('Sau khi fix','after');
 if(!isPG)P.insertAdjacentHTML('beforebegin','');
 detail();
 if(S._lastTab===tabKey)document.querySelectorAll('.pane').forEach(p=>{if(keep[p.dataset.mode]!=null)p.scrollTop=keep[p.dataset.mode]});S._lastTab=tabKey;
 const sd=document.querySelector('.side');if(sd)sd.scrollTop=sideTop;const dt=document.querySelector('.detail');if(dt)dt.scrollTop=detTop;
}
function detail(){
 const el=document.getElementById('detail'),h=S.sel;
 if(!h){el.innerHTML='<div class="empty">Bấm vào dòng đỏ, nhãn lỗi hoặc một lỗi ở cột trái để xem chi tiết và bằng chứng.</div>';return}
 const m=META[h.id],same=ALL.filter(x=>x.id===h.id),idx=same.indexOf(h);
 const cur=typeof h.cur==='string'?h.cur:JSON.stringify(h.cur);
 const fx=h.fix.op==='remove'?'— '+h.fix.label+' —':h.fix.op==='replace'?JSON.stringify(h.fix.value):h.fix.value;
 el.innerHTML=`<span class="code ${m.cat}">${h.id}</span> <span class="mut">${CAT[m.cat]}</span><h3>${m.t}</h3>
 <div class="lbl">Vị trí</div><div class="mut" style="font:12px ui-monospace,Menlo,monospace">${esc(h.path)}</div>
 <div class="lbl">Đang là</div><pre class="v bad">${esc(cur)}</pre>
 <div class="lbl">Sau fix</div><pre class="v good">${esc(fx)}</pre>
 <div class="lbl">Bằng chứng kiểm tra trên schema thật</div><div>${esc(h.ev)}</div>
 <div class="lbl">Vì sao là lỗi</div><div>${esc(m.why)}</div>
 <div class="lbl">${same.length} vị trí cùng lỗi (đang xem ${idx+1}/${same.length})</div>
 <div class="locs">${same.map((x,i)=>`<a data-i="${ALL.indexOf(x)}">${i+1}. ${esc(x.path)}</a>`).join('')}</div>
 <div class="nav"><button class="btn" id="prev">‹ Trước</button><button class="btn" id="next">Sau ›</button></div>`;
 const go=d=>pick(same[(idx+d+same.length)%same.length],true);
 document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);
}
function pick(h,jump){S.sel=h;S.selRule=h.id;if(jump){ancestors(h.path).forEach(a=>S.open.add(a));S.tab='ProductGroup';if(S.cats.has(META[h.id].cat)===false)S.cats.add(META[h.id].cat)}render();
 if(jump)document.querySelectorAll('.row.sel').forEach((r,i)=>{if(i===0){const pn=r.closest('.pane');pn.scrollTop=r.offsetTop-pn.clientHeight/2}})}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-m],[data-c],.rule,.tab,.tag,.row,[data-i],#onlyerr,#expall,#colall');if(!t)return;
 if(t.dataset.m){S.mode=t.dataset.m;render();return}
 if(t.dataset.c){S.cats.has(t.dataset.c)?S.cats.delete(t.dataset.c):S.cats.add(t.dataset.c);S.sel=null;render();return}
 if(t.id==='onlyerr'){S.onlyErr=!S.onlyErr;t.style.outline=S.onlyErr?'2px solid var(--sel)':'';render();return}
 if(t.id==='expall'){const walk=(v,p)=>{if(v&&typeof v==='object'){S.open.add(p);Object.keys(v).forEach(k=>walk(v[k],join(p,Array.isArray(v)?+k:k)))}};walk(DATA[S.tab],'');render();return}
 if(t.id==='colall'){S.open=new Set(['']);render();return}
 if(t.classList.contains('rule')){const f=ALL.find(h=>h.id===t.dataset.id&&S.cats.has(META[h.id].cat));if(f)pick(f,true);return}
 if(t.classList.contains('tab')){S.tab=t.dataset.t;S.sel=null;render();return}
 if(t.classList.contains('tag')||(t.dataset.i&&t.tagName==='A')){pick(ALL[+t.dataset.i],false);return}
 if(t.classList.contains('row')){
  const p=t.dataset.path;
  if(t.dataset.f){const k='before'+p,k2='after'+p;S.full.has(k)?S.full.delete(k):S.full.add(k);S.full.has(k2)?S.full.delete(k2):S.full.add(k2);render();return}
  const h=active().find(x=>x.path===p);
  if(t.dataset.t){S.open.has(p)?S.open.delete(p):S.open.add(p)}
  if(h)S.sel=h,S.selRule=h.id;render()}
});
document.addEventListener('scroll',e=>{if(S.mode!=='both')return;const ps=[...document.querySelectorAll('.pane')];if(ps.length!==2||e.target===document)return;const s=e.target,o=ps.find(x=>x!==s);if(!o||s.__lock)return;o.__lock=1;o.scrollTop=s.scrollTop*(o.scrollHeight-o.clientHeight)/Math.max(1,s.scrollHeight-s.clientHeight);setTimeout(()=>o.__lock=0,30)},true);
defaultOpen();render();
</script>
</body>
</html>
